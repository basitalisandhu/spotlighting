name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: The demo SVG is current
        run: |
          python scripts/render_demo.py --output /tmp/demo.svg
          diff /tmp/demo.svg docs/demo.svg
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          spotlighting --version
          spotlighting demo | head -3
          printf 'The build passed on all platforms.\n' | spotlighting mark --mode datamark | grep -F 'The^build^passed'
          printf 'The build passed.\n' | spotlighting mark --mode encode | spotlighting unmark --mode encode | grep -Fx 'The build passed.'

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the test tools only
        run: python -m pip install "pytest>=8.0" "hypothesis>=6.100" build
      - name: Build the wheel, install it in a fresh venv, run the README quick start
        env:
          SPOTLIGHTING_E2E: "1"
        run: python -m pytest -q tests/test_quickstart_e2e.py

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and mark text from stdin and from a mount
        run: |
          docker build --build-arg VERSION=ci -t spotlighting:ci .
          docker run --rm spotlighting:ci --help > help.txt && grep "^usage: spotlighting" help.txt
          docker run --rm spotlighting:ci --version
          test "$(docker run --rm --entrypoint id spotlighting:ci -u)" = "1000"
          printf 'The build passed.\n' | docker run --rm -i spotlighting:ci mark --mode datamark | grep -Fx 'The^build^passed.^'
          docker run --rm -v "$PWD:/work:ro" spotlighting:ci mark --mode encode --format json LICENSE > out.json
          python3 -c "import json; d = json.load(open('out.json')); assert d['mode'] == 'encode'"
